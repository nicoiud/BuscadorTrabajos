<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>BuscadorTrabajos Autofill</title>
    <style>
      body {
        width: 260px;
        font-family: system-ui, sans-serif;
        padding: 12px;
        color: #1e293b;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #64748b;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 6px;
      }
      #fillBtn {
        background: #4f46e5;
        color: white;
      }
      #optionsBtn {
        background: #f1f5f9;
        color: #334155;
      }
      #status {
        font-size: 11px;
        color: #dc2626;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h1>BuscadorTrabajos Autofill</h1>
    <p>Completa los campos de este formulario con tu perfil. Nunca lo envía por vos.</p>
    <button id="fillBtn">Rellenar este formulario</button>
    <button id="optionsBtn">Editar mi perfil</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
